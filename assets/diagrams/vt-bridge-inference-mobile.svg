<title id="architecture-title">VT-Bridge neural architecture</title><desc id="architecture-desc">Two Transformer encoders map the VLA action chunk and recent force window to features. Their concatenation enters an MLP residual head. A skip connection adds the nominal action to the predicted residual. The action feature is cached; the force feature is updated at each execution step. Vector cells and module shapes are schematic, not layer counts or hidden dimensions.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(10.8 858.8)">
<title>VTBridge</title>
<polygon fill="white" stroke="transparent" points="-10.8,10.8 -10.8,-858.8 368.8,-858.8 368.8,10.8 -10.8,10.8" />
<text text-anchor="middle" x="179" y="-7.2" font-family="Helvetica,sans-Serif" font-size="11.00">Dashed group: residual adapter (0.98M parameters)</text>
